services:
  edu-dashboard:
    build: .
    container_name: edu-dashboard
    restart: unless-stopped
    stop_signal: SIGINT      # python http.server doesn't handle SIGTERM → avoids the 10s grace period on stop/restart
    stop_grace_period: 2s
    # Optional: bind ONLY on a Tailscale IP to expose over the private mesh
    # ports:
    #   - "100.x.y.z:8801:8800"
    ports:
      - "8801:8800"
    environment:
      - DATA_DIR=/data
    volumes:
      # Bind the DIRECTORY (not the file). os.replace needs to swap within the same fs;
      # binding a single file into the container makes it a mount point and EBUSY on rename.
      - ./data:/data
